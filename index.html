<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Čeština expres 4 – interaktivní opakování</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#252a36;background:#f5f7fb}body{margin:0}header{background:#233f69;color:white;padding:24px max(20px,calc((100vw - 980px)/2))}h1{margin:5px 0}main{max-width:980px;margin:22px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #b8c9dc;border-radius:10px;background:white;padding:10px 14px}button.active,.primary{background:#234f86;color:white;border-color:#234f86}.panel{background:white;border:1px solid #e0e6ef;border-radius:16px;padding:24px;box-shadow:0 3px 12px #16263a0c}.task{padding:14px 0;border-bottom:1px solid #edf0f5}.task:last-child{border:0}input,select,textarea{padding:9px;border:1px solid #b8c9dc;border-radius:8px;max-width:100%;box-sizing:border-box}input{width:220px}textarea{width:100%;min-height:110px}.ok{color:#137342}.bad{color:#af3030}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hint{color:#5c6779}.dialogrow{display:flex;gap:10px;align-items:center;padding:9px;margin:7px 0;border:1px solid #dbe4ee;border-radius:10px}.dialogrow span{flex:1}.dialogrow button{padding:6px 10px}.blank{width:155px;margin:3px}.wordbank{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.wordbank span{background:#eaf1fb;border-radius:8px;padding:7px 10px}.sentence{line-height:2.5}.score{font-weight:700;margin-top:15px}@media(max-width:600px){.panel{padding:16px}.blank{width:125px}header{padding:20px}}</style>
<header><small>ČEŠTINA EXPRES 4 · LEKCE 4</small><h1>Interaktivní opakování</h1><div>Úlohy 2–6 · bez poslechu · úroveň A2</div></header><main><nav class="tabs" id="tabs"></nav><section class="panel" id="app"></section></main>
<script>
const DATA={"defs": [["místo v centru města, kolem jsou domy, někdy je tam trh", "náměstí"], ["místo, kde je voda a kde „bydlí“ ryby", "rybník"], ["místo na náměstí, kde je voda", "kašna"], ["místo, kde se pěstují květiny, stromy nebo zelenina", "zahrada"], ["malá, nevysoká hora", "kopec"], ["místo, kde jezdí auta, autobusy a motorky", "silnice"], ["místo, kde bydleli aristokrati (král, královna, princ, princezna...)", "zámek"]], "preps": [["Včera jsem byl ___ koncertě.", "na"], ["Žiju ___ Praze.", "v"], ["Můj kamarád bydlí ___ banky.", "vedle"], ["Sejdeme se ___ hospody.", "před"], ["Pes leží ___ stromem.", "pod"], ["Taxík čeká ___ hotelem.", "před"], ["Auto stojí ___ poštou.", "před"], ["Klub je ___ galerií a kinem.", "mezi"], ["Nejradši sedím ___ obýváku.", "v"], ["Stojím ___ domem.", "před"], ["Bydlím ___ restaurace.", "vedle"], ["Čekám ___ divadlem.", "před"], ["Bydlím ___ centru.", "v"], ["Letadlo letí ___ kopcem.", "nad"]], "dialog": ["Nechceš přijít na návštěvu?", "Moc ráda. A kdy se ti to hodí?", "Co třeba v sobotu dopoledne? Hodí se ti to?", "Ano, hodí. Kde bydlíš?", "V Českém Brodě.", "Jak se tam jede?", "Musíš jet vlakem z Hlavního nádraží asi 30 minut.", "A bydlíš daleko od nádraží?", "Ne, je to blízko. Půjdeš rovně, jak jede vlak, a pak první ulicí doprava. Náš dům je vlevo.", "Dobře, to najdu, nebo ti zavolám.", "Tak jo, těším se."], "bank": ["výhoda je", "restaurace", "co mi vadí", "centru", "od narození", "vedle", "trhy"], "text": "Bydlím {0} v Praze přímo v {1} blízko Staroměstského náměstí. {2}, že Staré Město je moc krásné a že hned {3} našeho domu je výborná řecká restaurace. Chodíme často do {4}, protože neradi vaříme. Na náměstí jsou často {5} a koncerty. Bydlet v centru je super. Jediné, {6}, jsou turisti. Je jich opravdu hodně."};
const sections=['2. Co je to?','3. Kde žiju','4. Předložky','5. Dialog','6. Doplňte text'];
let page=0,results={},order=[...DATA.dialog.keys()].sort((a,b)=>((a*7+3)%11)-((b*7+3)%11));
const app=document.querySelector('#app'),tabs=document.querySelector('#tabs');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(n){page=n;render()}
function render(){tabs.innerHTML=sections.map((s,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})">${s}</button>`).join('');
if(page===0)app.innerHTML=`<h2>2. Doplňte, co je to.</h2><p class="hint">Napište správné slovo podle definice.</p>`+DATA.defs.map(([q],i)=>`<div class="task"><label>${i+1}. ${esc(q)} – <input id="d${i}" autocomplete="off"></label><span id="r${i}"></span></div>`).join('')+actions('defs');
if(page===1)app.innerHTML=`<h2>3. Napište o místě, kde žijete.</h2><p class="hint">Můžete odpovídat ústně nebo si odpovědi zapsat.</p>`+['Bydlím…','Musím tam bydlet, protože…','Před domem je…','Mám to blízko do…','Bohužel tam není…','Líbí se mi, že tam je / není…'].map((q,i)=>`<div class="task"><label><b>${esc(q)}</b><br><textarea id="t${i}" rows="2"></textarea></label></div>`).join('')+`<div class="actions"><button class="primary" onclick="alert('Tuto aktivitu vyhodnotíte společně při rozhovoru.')">Hotovo – proberte odpovědi</button></div>`;
if(page===2)app.innerHTML=`<h2>4. Doplňte správnou prepozici.</h2><p class="hint">Vyberte předložku. U některých vět může být více smysluplných řešení; kontrola používá vzorové odpovědi.</p>`+DATA.preps.map(([q],i)=>`<div class="task">${i+1}. ${esc(q).replace('___',`<select id="p${i}"><option value="">— vyberte —</option>${['na','v','ve','u','vedle','před','pod','nad','mezi','za','do'].map(x=>`<option>${x}</option>`).join('')}</select>`)} <span id="r${i}"></span></div>`).join('')+actions('preps');
if(page===3)app.innerHTML=`<h2>5. Seřaďte dialog (1–11).</h2><p class="hint">Použijte šipky a přesuňte věty do správného pořadí.</p><div id="dialog">${order.map((idx,i)=>`<div class="dialogrow"><b>${i+1}.</b><span>${esc(DATA.dialog[idx])}</span><button onclick="move(${i},-1)" aria-label="Nahoru">↑</button><button onclick="move(${i},1)" aria-label="Dolů">↓</button></div>`).join('')}</div>`+actions('dialog');
if(page===4)app.innerHTML=`<h2>6. Doplňte text.</h2><p class="hint">Vyberte výrazy z nabídky. Každý výraz použijte jednou.</p><div class="wordbank">${DATA.bank.map(w=>`<span>${esc(w)}</span>`).join('')}</div><div class="sentence">${DATA.text.replace(/\{(\d)\}/g,(_,i)=>`<select class="blank" id="b${i}"><option value="">— vyberte —</option>${DATA.bank.map(w=>`<option>${esc(w)}</option>`).join('')}</select><span id="r${i}"></span>`)}</div>`+actions('bank');
}
function actions(type){return `<div class="actions"><button class="primary" onclick="check('${type}')">Zkontrolovat</button><button onclick="reset()">Zkusit znovu</button></div><div id="score" class="score" aria-live="polite"></div>`}
function norm(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function check(type){let good=0,total=0;const mark=(i,yes,expected)=>{total++;good+=+yes;let r=document.querySelector('#r'+i);if(r)r.innerHTML=` <small class="${yes?'ok':'bad'}">${yes?'✓':'✗ '+esc(expected)}</small>`};
if(type==='defs')DATA.defs.forEach(([,a],i)=>mark(i,norm(document.querySelector('#d'+i).value)===norm(a),a));
if(type==='preps')DATA.preps.forEach(([,a],i)=>{let v=document.querySelector('#p'+i).value;mark(i,v===a||([2,3,5,6,9,10,11].includes(i)&&['před','vedle','za','u'].includes(v)),a)});
if(type==='bank')DATA.bank.forEach((_,i)=>mark(i,document.querySelector('#b'+i).value===DATA.bank[[5,3,0,4,1,6,2][i]],DATA.bank[[5,3,0,4,1,6,2][i]]));
if(type==='dialog'){total=11;good=order.filter((v,i)=>v===i).length;document.querySelectorAll('.dialogrow').forEach((r,i)=>{r.style.borderColor=order[i]===i?'#3b9b6d':'#d36a6a'})}
document.querySelector('#score').textContent=`Správně: ${good} z ${total}.`;
}
function move(i,d){let j=i+d;if(j<0||j>=order.length)return;[order[i],order[j]]=[order[j],order[i]];render()}
function reset(){if(page===3)order=[...DATA.dialog.keys()].sort((a,b)=>((a*7+3)%11)-((b*7+3)%11));render()}
render();
</script></html>
